services:
  postgres:
    image: postgres:15-alpine
    container_name: psms-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: psms_dev
    ports:
      - '5432:5432'
    networks:
      - psms-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d psms_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: psms-redis
    ports:
      - '6379:6379'
    networks:
      - psms-network
    volumes:
      - redis-data:/data

networks:
  psms-network:

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
