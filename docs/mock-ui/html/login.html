<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PSMS – Login / Register</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #fff; border: 1px solid #ccc; padding: 32px; width: 420px; }
    h1 { font-size: 20px; text-align: center; margin-bottom: 24px; }
    .tabs { display: flex; border-bottom: 2px solid #ccc; margin-bottom: 24px; }
    .tabs button { flex: 1; padding: 10px; border: none; background: none; cursor: pointer; font-size: 14px; }
    .tabs button.active { border-bottom: 2px solid #333; font-weight: bold; margin-bottom: -2px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; margin-bottom: 4px; }
    input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 8px; border: 1px solid #ccc; font-size: 14px; }
    input:focus { outline: 2px solid #333; }
    .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 16px; }
    .btn-primary { width: 100%; padding: 10px; background: #333; color: #fff; border: none; cursor: pointer; font-size: 14px; }
    .btn-primary:hover { background: #555; }
    .link-row { text-align: center; margin-top: 16px; font-size: 13px; }
    .link-row a { color: #333; }
    .error-msg { background: #fce8e8; border: 1px solid #e88; color: #a00; padding: 8px; font-size: 13px; margin-bottom: 12px; display: none; }
    .success-msg { background: #e8f5e8; border: 1px solid #8c8; color: #060; padding: 8px; font-size: 13px; margin-bottom: 12px; display: none; }
    .panel { display: none; }
    .panel.active { display: block; }
  </style>
</head>
<body>
<div class="card">
  <h1>PSMS — Personal Scheduling Manager</h1>

  <div class="tabs">
    <button class="active" onclick="switchTab('login', this)">Login</button>
    <button onclick="switchTab('register', this)">Register</button>
  </div>

  <!-- Login Panel -->
  <div id="login" class="panel active">
    <div class="error-msg" id="login-error">Invalid email or password. Please try again.</div>
    <div class="form-group">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label for="login-password">Password</label>
      <input type="password" id="login-password" placeholder="••••••••">
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="remember-me">
      <label for="remember-me">Remember Me</label>
    </div>
    <button class="btn-primary" onclick="doLogin()">Login</button>
    <div class="link-row">
      <a href="forgot-password.html">Forgot Password?</a>
    </div>
  </div>

  <!-- Register Panel -->
  <div id="register" class="panel">
    <div class="error-msg" id="register-error">Email already in use or passwords do not match.</div>
    <div class="success-msg" id="register-success">Account created! Please check your email to verify your account.</div>
    <div class="form-group">
      <label for="reg-name">Full Name</label>
      <input type="text" id="reg-name" placeholder="John Doe">
    </div>
    <div class="form-group">
      <label for="reg-email">Email</label>
      <input type="email" id="reg-email" placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label for="reg-password">Password</label>
      <input type="password" id="reg-password" placeholder="Minimum 8 characters">
    </div>
    <div class="form-group">
      <label for="reg-confirm">Confirm Password</label>
      <input type="password" id="reg-confirm" placeholder="Repeat password">
    </div>
    <button class="btn-primary" onclick="doRegister()">Create Account</button>
    <div class="link-row">
      Already have an account? <a href="#" onclick="switchTab('login', null)">Login</a>
    </div>
  </div>
</div>

<script>
  function switchTab(tab, btn) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    document.getElementById(tab).classList.add('active');
    if (btn) btn.classList.add('active');
    else document.querySelectorAll('.tabs button')[0].classList.add('active');
  }

  function doLogin() {
    const email = document.getElementById('login-email').value.trim();
    const pwd = document.getElementById('login-password').value;
    const err = document.getElementById('login-error');
    if (!email || !pwd) { err.style.display = 'block'; err.textContent = 'Please fill in all fields.'; return; }
    // Simulate redirect
    err.style.display = 'none';
    alert('Login successful — redirecting to Calendar Dashboard.\n(In production this would go to calendar-dashboard.html)');
    window.location.href = 'calendar-dashboard.html';
  }

  function doRegister() {
    const name = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const pwd = document.getElementById('reg-password').value;
    const confirm = document.getElementById('reg-confirm').value;
    const err = document.getElementById('register-error');
    const succ = document.getElementById('register-success');
    err.style.display = 'none';
    succ.style.display = 'none';
    if (!name || !email || !pwd || !confirm) { err.textContent = 'Please fill in all fields.'; err.style.display = 'block'; return; }
    if (pwd !== confirm) { err.textContent = 'Passwords do not match.'; err.style.display = 'block'; return; }
    if (pwd.length < 8) { err.textContent = 'Password must be at least 8 characters.'; err.style.display = 'block'; return; }
    succ.style.display = 'block';
  }
</script>
</body>
</html>
