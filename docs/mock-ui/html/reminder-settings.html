<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PSMS – Reminder Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; }
    header { background: #333; color: #fff; display: flex; align-items: center; padding: 0 16px; height: 48px; gap: 12px; }
    header .logo { font-weight: bold; font-size: 16px; margin-right: 16px; }
    header input[type="text"] { flex: 1; max-width: 320px; padding: 6px 10px; border: none; font-size: 13px; }
    header .notif-btn { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; }
    header .user-info { margin-left: auto; font-size: 13px; }
    .layout { display: flex; min-height: calc(100vh - 48px); }
    aside { width: 200px; background: #fff; border-right: 1px solid #ddd; padding: 16px; flex-shrink: 0; }
    aside a { display: block; padding: 7px 8px; font-size: 14px; color: #333; text-decoration: none; border-radius: 4px; }
    aside a:hover, aside a.active { background: #eee; font-weight: bold; }
    main { flex: 1; padding: 20px; max-width: 860px; }
    h2 { font-size: 20px; margin-bottom: 16px; }
    .section { background: #fff; border: 1px solid #ddd; padding: 20px; margin-bottom: 20px; }
    .section h3 { font-size: 14px; font-weight: bold; margin-bottom: 16px; border-bottom: 1px solid #eee; padding-bottom: 8px; text-transform: uppercase; font-size: 12px; color: #555; }
    .form-row { margin-bottom: 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .form-row label.field-label { width: 220px; font-size: 13px; flex-shrink: 0; }
    .form-row select, .form-row input[type="number"] { padding: 7px; border: 1px solid #ccc; font-size: 13px; }
    .form-row input[type="checkbox"] { width: 16px; height: 16px; }
    .btn-primary { padding: 8px 20px; background: #333; color: #fff; border: none; cursor: pointer; font-size: 13px; }
    .success-msg { display: none; background: #d4edda; border: 1px solid #c3e6cb; color: #155724; padding: 8px; font-size: 12px; margin-top: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: #f5f5f5; padding: 9px 12px; text-align: left; border-bottom: 2px solid #ddd; font-size: 11px; text-transform: uppercase; }
    td { padding: 9px 12px; border-bottom: 1px solid #eee; vertical-align: middle; }
    tr:hover td { background: #fafafa; }
    .badge-due { background: #fce8e8; color: #a00; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
    .badge-sched { background: #e8f5e8; color: #060; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
    .remove-btn { background: none; border: none; cursor: pointer; color: #c00; font-size: 14px; }
    .remove-btn:hover { background: #fce8e8; }
    .empty-note { font-size: 13px; color: #888; padding: 12px; text-align: center; }
  </style>
</head>
<body>

<header>
  <span class="logo">PSMS</span>
  <button class="notif-btn" onclick="window.location.href='notification-log.html'">🔔</button>
  <input type="text" placeholder="Search appointments...">
  <span class="user-info">▸ John Doe</span>
</header>

<div class="layout">
  <aside>
    <a href="calendar-dashboard.html">📅 Calendar</a>
    <a href="appointment-management.html">📋 Appointments</a>
    <a href="tag-management.html">🏷 Tags</a>
    <a href="reminder-settings.html" class="active">🔔 Reminders</a>
    <a href="notification-log.html">📩 Notifications</a>
    <a href="statistics-dashboard.html">📊 Statistics</a>
    <a href="export-data.html">📤 Export</a>
    <a href="profile-page.html">👤 Profile</a>
  </aside>

  <main>
    <h2>Reminder Settings</h2>

    <!-- Default Preferences -->
    <div class="section">
      <h3>Default Reminder Preferences</h3>
      <div class="form-row">
        <label class="field-label">Default reminder time for new appointments</label>
        <select id="default-time">
          <option>5 minutes before</option>
          <option selected>15 minutes before</option>
          <option>30 minutes before</option>
          <option>1 hour before</option>
          <option>2 hours before</option>
          <option>1 day before</option>
        </select>
      </div>
      <div class="form-row">
        <label class="field-label">Snooze duration</label>
        <select id="snooze-time">
          <option>5 minutes</option>
          <option selected>10 minutes</option>
          <option>15 minutes</option>
          <option>30 minutes</option>
        </select>
      </div>
      <div class="form-row">
        <input type="checkbox" id="email-notif">
        <label for="email-notif" style="font-size:13px;">Also send reminders to my email address</label>
      </div>
      <button class="btn-primary" onclick="savePrefs()">Save Preferences</button>
      <div class="success-msg" id="pref-saved">✓ Preferences saved successfully.</div>
    </div>

    <!-- Upcoming Reminders -->
    <div class="section">
      <h3>Upcoming Reminders</h3>
      <table>
        <thead>
          <tr>
            <th>Appointment</th>
            <th>Lead Time</th>
            <th>Reminder At</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="reminder-tbody">
          <!-- Populated by JS -->
        </tbody>
      </table>
      <p id="empty-note" class="empty-note" style="display:none">No upcoming reminders.</p>
    </div>
  </main>
</div>

<script>
  let reminders = [
    { appt: 'Team Standup (Mar 14)', lead: '15 min before', at: 'Mar 14, 08:45', status: 'Due' },
    { appt: 'Doctor Appointment (Mar 14)', lead: '1 hr before', at: 'Mar 14, 10:00', status: 'Due' },
    { appt: 'Study Session (Mar 15)', lead: '30 min before', at: 'Mar 15, 13:30', status: 'Scheduled' },
    { appt: 'Sprint Review (Mar 16)', lead: '1 day before', at: 'Mar 15, 10:00', status: 'Scheduled' },
    { appt: 'Exam Prep (Mar 18)', lead: '2 hr before', at: 'Mar 18, 12:00', status: 'Scheduled' },
  ];

  function renderReminders() {
    const tbody = document.getElementById('reminder-tbody');
    tbody.innerHTML = '';
    if (reminders.length === 0) { document.getElementById('empty-note').style.display = 'block'; return; }
    document.getElementById('empty-note').style.display = 'none';
    reminders.forEach((r, i) => {
      const badge = r.status === 'Due' ? `<span class="badge-due">Due</span>` : `<span class="badge-sched">Scheduled</span>`;
      tbody.innerHTML += `<tr>
        <td>${r.appt}</td>
        <td>${r.lead}</td>
        <td>${r.at}</td>
        <td>${badge}</td>
        <td><button class="remove-btn" onclick="removeReminder(${i})" title="Remove reminder">✕</button></td>
      </tr>`;
    });
  }

  function removeReminder(i) {
    if (confirm('Remove this reminder?')) { reminders.splice(i, 1); renderReminders(); }
  }

  function savePrefs() {
    const msg = document.getElementById('pref-saved');
    msg.style.display = 'block';
    setTimeout(() => msg.style.display = 'none', 3000);
  }

  renderReminders();
</script>
</body>
</html>
